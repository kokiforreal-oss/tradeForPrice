# Linux 生产（host 网络）：沿用现有 .env 里 127.0.0.1 的 MySQL，以及宿主机 Nginx 反代 8000。
# 本机开发请继续 ./start.sh，不要用这份 compose（Mac 上 host 网络行为不同）。
version: "3.8"
services:
  trade:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    network_mode: host
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./.env:/app/.env:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
